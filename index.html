<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="我慢貯金">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <!-- 更新のたびに v の番号を上げ、古いキャッシュとの混在を防ぐ -->
  <link rel="stylesheet" href="style.css?v=6">
  <title>我慢貯金</title>
</head>
<body>
  <main class="home" id="view-home">
    <!-- キャラ画像ができるまでの仮の表示 -->
    <div class="character" id="character" data-stage="egg" data-mood="normal" aria-hidden="true">
      <span class="eye"></span><span class="eye"></span><span class="mouth"></span>
    </div>
    <p class="message" id="message">今日もよく来てくれたね!</p>

    <section class="growth" aria-label="キャラの成長">
      <p class="growth-title"><span id="stage">たまご</span> <b>Lv.<span id="level">1</span></b></p>
      <div class="bar"><div class="bar-fill" id="level-bar"></div></div>
      <p class="count">次のレベルまで あと<span id="next-level">500</span>円</p>
    </section>

    <section class="savings" aria-label="現在の貯金額">
      <h1>現在の我慢貯金</h1>
      <p class="amount"><span id="total">0</span><small>円</small></p>
      <p class="count"><span id="count">0</span>回 我慢できた ・ 累計<span id="cumulative">0</span>円</p>
      <p class="next-milestone" id="next-milestone" hidden></p>
    </section>

    <button class="primary" id="open-sheet" type="button">我慢した!</button>
    <button class="quiet" id="open-spent" type="button">使っちゃった…</button>
    <p class="note">実際の貯金ではなく、記録上の金額です(ver.6)</p>
  </main>

  <main class="history" id="view-history" hidden>
    <h1>履歴</h1>
    <p class="note" id="history-empty">まだ記録がありません</p>
    <ul class="records" id="records"></ul>
  </main>

  <main class="history" id="view-milestones" hidden>
    <h1>マイルストーン</h1>
    <button class="secondary" id="open-goal" type="button">目標を追加</button>

    <h2 class="section-title">自分の目標</h2>
    <p class="note" id="goals-empty">「沖縄旅行」のように、貯めて叶えたいことを追加できます</p>
    <ul class="records" id="goals"></ul>

    <section id="suggestions-section">
      <h2 class="section-title">こんなことができるよ</h2>
      <ul class="records" id="suggestions"></ul>
    </section>

    <section id="achieved-section" hidden>
      <h2 class="section-title">達成したこと</h2>
      <ul class="records" id="achieved"></ul>
    </section>
  </main>

  <nav class="tabs" aria-label="画面の切り替え">
    <button class="tab" id="tab-home" type="button" aria-current="page">ホーム</button>
    <button class="tab" id="tab-history" type="button">履歴</button>
    <button class="tab" id="tab-milestones" type="button">目標</button>
  </nav>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-header">
      <h2 id="sheet-title">何を我慢した?</h2>
      <button class="close" id="close-sheet" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="item-step">
      <ul class="templates" id="templates"></ul>
      <button class="quiet full" id="open-manual" type="button">項目を選ばずに入力</button>
    </div>
    <div id="amount-step" hidden>
      <p class="sheet-lead">いくら我慢した?</p>
      <div class="amount-options" id="amount-options"></div>
      <button class="secondary" id="amount-custom" type="button">金額を入力</button>
      <button class="quiet full" id="back-to-items" type="button">項目を選び直す</button>
    </div>
  </dialog>

  <dialog class="sheet form-sheet" id="form-sheet" aria-labelledby="form-title">
    <form id="record-form">
      <div class="sheet-header">
        <h2 id="form-title">金額を入力して記録</h2>
        <button class="close" id="close-form" type="button" aria-label="閉じる">×</button>
      </div>
      <label class="field">
        <span>金額(円)</span>
        <input id="field-amount" type="number" inputmode="numeric" min="1" max="9999999" step="1" required>
      </label>
      <label class="field">
        <span>カテゴリ</span>
        <select id="field-category"></select>
      </label>
      <label class="field">
        <span>メモ(任意)</span>
        <input id="field-memo" type="text" maxlength="100">
      </label>
      <button class="primary" type="submit">保存する</button>
      <button class="danger" id="delete-record" type="button" hidden>この記録を削除</button>
    </form>
  </dialog>

  <dialog class="sheet form-sheet" id="goal-sheet" aria-labelledby="goal-title">
    <form id="goal-form">
      <div class="sheet-header">
        <h2 id="goal-title">目標を追加</h2>
        <button class="close" id="close-goal" type="button" aria-label="閉じる">×</button>
      </div>
      <label class="field">
        <span>叶えたいこと</span>
        <input id="goal-name" type="text" maxlength="40" required>
      </label>
      <label class="field">
        <span>目標金額(円)</span>
        <input id="goal-amount" type="number" inputmode="numeric" min="1" max="99999999" step="1" required>
      </label>
      <button class="primary" type="submit">保存する</button>
      <button class="danger" id="delete-goal" type="button" hidden>この目標を削除</button>
    </form>
  </dialog>

  <script src="app.js?v=6"></script>
</body>
</html>
